name: Fetch property photos

# The photographs live on the owner's CDN. This job pulls them, optimises them,
# and commits the result so the repository carries its own images.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-photos.mjs'
      - '.github/workflows/fetch-photos.yml'

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sharp
        run: npm install --no-save sharp@0.34.2

      - name: Fetch and optimise photos
        run: node scripts/fetch-photos.mjs

      - name: Commit photos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/property
          if git diff --cached --quiet; then
            echo "No photo changes."
          else
            git commit -m "Add property photography fetched from the owner's CDN"
            git push origin HEAD:${{ github.ref_name }}
          fi
