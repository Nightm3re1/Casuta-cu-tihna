name: Deploy to Vercel

# Optional, and manual-only on purpose.
#
# The recommended route is to connect this repository in the Vercel dashboard,
# which builds every push on its own — see README. This workflow exists for the
# case where you would rather deploy from CI with a token. Run it from the
# Actions tab once VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID exist as
# repository secrets. Keeping it manual means the two systems can never race.
on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production (otherwise a preview)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set — skipping deploy."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROD: ${{ inputs.production && '--prod' || '' }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=${{ inputs.production && 'production' || 'preview' }} --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build $PROD --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt $PROD --token="${{ secrets.VERCEL_TOKEN }}" | tee url.txt
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$(tail -1 url.txt)" >> "$GITHUB_STEP_SUMMARY"
