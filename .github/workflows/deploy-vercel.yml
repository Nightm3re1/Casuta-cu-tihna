name: Deploy to Vercel

# Optional. Runs only once VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# exist as repository secrets. If you connect the repo in the Vercel dashboard
# instead, Vercel builds on every push on its own and this workflow can be
# deleted — you do not need both.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set — skipping deploy."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROD: ${{ github.ref_name == 'main' && '--prod' || '' }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build $PROD --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt $PROD --token="${{ secrets.VERCEL_TOKEN }}" | tee url.txt
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$(tail -1 url.txt)" >> "$GITHUB_STEP_SUMMARY"
